# This docker-compose file defines the containerized environment for the application.
# It sets up a Django container with appropriate volumes for persistent storage,
# port mapping (8000:8000), and environment variables.
# The container uses the docker_entrypoint.sh script to initialize the database
# and start the development server.
services:
  django:
    image: webapp-image:latest
    container_name: webapp-container
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - app_storage:/app/storage
      - app_media:/app/media
    environment:
      PYTHONPATH: "/app"
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      DATABASE_URL: "sqlite:////app/storage/db.sqlite3"
    command: sh /app/docker_entrypoint.sh

volumes:
  app_storage:
  app_media: