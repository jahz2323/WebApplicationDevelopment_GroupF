{% load django_bootstrap5 %}

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Edit User{% endblock %}</title>
    {% bootstrap_css %}
    {% bootstrap_javascript %}
</head>
<body>
    {% include 'common/leftmenu.html' %}
    
    <main class="container mt-4">
        <h1>Edit User</h1>
        <form method="POST">
            {% csrf_token %}
            
            <!-- Username and Email -->
            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">Username</label>
                <input type="text" name="username" value="{{ form.username.value }}" class="form-control" id="{{ form.username.id_for_label }}">
            </div>
            
            <div class="form-group">
                <label for="{{ form.email.id_for_label }}">Email</label>
                <input type="email" name="email" value="{{ form.email.value }}" class="form-control" id="{{ form.email.id_for_label }}">
            </div>
            
            <!-- Role Selection (Group) -->
            <div class="form-group">
                <label for="{{ form.role.id_for_label }}">Role</label>
                <select name="role" class="form-control" id="{{ form.role.id_for_label }}">
                    {% for choice in form.role.field.choices %}
                        <option value="{{ choice.0 }}" {% if form.role.value == choice.0 %}selected{% endif %}>{{ choice.1 }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Machinery Assignment -->
            <div class="form-group">
                <label>Assign Machines</label>
                <div class="form-check">
                    {% for machine in form.assigned_machinery %}
                        <div class="form-check">
                            <input type="checkbox" name="assigned_machinery" value="{{ machine.choice_value }}" id="machine_{{ machine.choice_value }}" class="form-check-input" {% if machine.checked %}checked{% endif %}>
                            <label class="form-check-label" for="machine_{{ machine.choice_value }}">{{ machine.choice_label }}</label>
                        </div>
                    {% endfor %}
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary">Update User</button>
        </form>
    </main>

    {% block javascript %}{% endblock %}
</body>
</html>
