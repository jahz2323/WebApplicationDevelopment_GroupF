{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login Page</title>
  </head>
  <body
    style="
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: rgba(14, 14, 14, 0.71);
    "
  >
    {% include 'common/navbar.html'%}

    <div
      class="container"
      style="
        width: 100%;
        max-width: 400px;
        margin: 60px auto;
        background-color: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      "
    >
      <div class="row">
        <form
          id="login-form"
          method="post"
          action="/Login/"
          style="display: flex; flex-direction: column"
        >
          {% csrf_token %}

          <!-- Label for Username -->
          <label
            for="username"
            style="
              margin-bottom: 5px;
              font-size: 16px;
              font-weight: bold;
              color: rgb(51, 51, 51);
            "
            >Username:</label
          >
          <input
            type="text"
            id="username"
            name="username"
            required
            style="
              padding: 10px;
              margin-bottom: 15px;
              border: 1px solid rgb(204, 204, 204);
              border-radius: 4px;
            "
          />

          <!-- Label for Password -->
          <label
            for="password"
            style="
              margin-bottom: 5px;
              font-size: 16px;
              font-weight: bold;
              color: rgb(51, 51, 51);
            "
            >Password:</label
          >
          <input
            type="password"
            id="password"
            name="password"
            required
            style="
              padding: 10px;
              margin-bottom: 20px;
              border: 1px solid rgb(204, 204, 204);
              border-radius: 4px;
            "
          />

          <!-- Submit Button -->
          <input
            type="submit"
            value="Login"
            style="
              padding: 10px;
              background-color: rgb(2, 176, 69);
              color: white;
              border: none;
              border-radius: 4px;
              cursor: pointer;
            "
          />

          <!-- Error and Success Messages -->
          {% if error %}
          <p style="color: red; margin-top: 15px">{{ error }}</p>
          {% endif %} {% if success %}
          <p style="color: green; margin-top: 15px">{{ success }}</p>
          {% endif %}
        </form>
      </div>
    </div>

    {% include 'common/footer.html' %}

    <script src="{% static 'js/jquery.validate.js' %}"></script>
    <script src="{% static 'js/Login.js' %}"></script>
  </body>
</html>
